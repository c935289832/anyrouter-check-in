name: Proxy actual exit-IP verification (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Measure 28 proxy exits using three independent services
        shell: bash
        run: |
          python3 - <<'PY'
          """Measure target-observed public exit IPs through the previously tested proxies."""
          from __future__ import annotations
          
          import collections
          import concurrent.futures as futures
          import datetime as dt
          import ipaddress
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import threading
          
          NODES = [{'number': 1, 'expected_proxy_server_ip': '134.209.15.92', 'proxy_url': 'https://dev.cloudpbx.us:443', 'scheme': 'https', 'prior_status_median_seconds': 0.739, 'alternate_urls': [], 'original_endpoints': ['134.209.15.92:443']}, {'number': 2, 'expected_proxy_server_ip': '130.253.2.250', 'proxy_url': 'https://admissions.du.edu:443', 'scheme': 'https', 'prior_status_median_seconds': 0.896, 'alternate_urls': [], 'original_endpoints': ['130.253.2.250:443']}, {'number': 3, 'expected_proxy_server_ip': '165.22.60.108', 'proxy_url': 'https://api.spaceroastery.com:443', 'scheme': 'https', 'prior_status_median_seconds': 1.142, 'alternate_urls': [], 'original_endpoints': ['165.22.60.108:443']}, {'number': 4, 'expected_proxy_server_ip': '128.84.46.176', 'proxy_url': 'https://webprotege.cbb.cornell.edu:443', 'scheme': 'https', 'prior_status_median_seconds': 1.231, 'alternate_urls': [], 'original_endpoints': ['128.84.46.176:443']}, {'number': 5, 'expected_proxy_server_ip': '160.16.144.120', 'proxy_url': 'https://radd-tsukuba.jp:443', 'scheme': 'https', 'prior_status_median_seconds': 1.246, 'alternate_urls': [], 'original_endpoints': ['160.16.144.120:443']}, {'number': 6, 'expected_proxy_server_ip': '129.97.50.72', 'proxy_url': 'https://blox.uwaterloo.ca:443', 'scheme': 'https', 'prior_status_median_seconds': 1.288, 'alternate_urls': ['https://dark.uwaterloo.ca:443'], 'original_endpoints': ['129.97.50.72:443']}, {'number': 7, 'expected_proxy_server_ip': '138.197.69.103', 'proxy_url': 'https://installer.activeidm.com:443', 'scheme': 'https', 'prior_status_median_seconds': 1.326, 'alternate_urls': [], 'original_endpoints': ['138.197.69.103:443']}, {'number': 8, 'expected_proxy_server_ip': '133.9.6.10', 'proxy_url': 'https://secure.mse.waseda.ac.jp:443', 'scheme': 'https', 'prior_status_median_seconds': 1.399, 'alternate_urls': [], 'original_endpoints': ['133.9.6.10:443', 'secure.mse.waseda.ac.jp:443']}, {'number': 9, 'expected_proxy_server_ip': '45.79.220.116', 'proxy_url': 'https://app.americanchristianministries.org:443', 'scheme': 'https', 'prior_status_median_seconds': 1.462, 'alternate_urls': [], 'original_endpoints': ['45.79.220.116:443']}, {'number': 10, 'expected_proxy_server_ip': '149.210.158.107', 'proxy_url': 'https://autodiscover.cybermolle.dk:5001', 'scheme': 'https', 'prior_status_median_seconds': 1.47, 'alternate_urls': ['https://autodiscover.dittmer-nielsen.dk:5001'], 'original_endpoints': ['149.210.158.107:5001']}, {'number': 11, 'expected_proxy_server_ip': '88.135.143.159', 'proxy_url': 'https://shluz.weblapas.eu:443', 'scheme': 'https', 'prior_status_median_seconds': 1.52, 'alternate_urls': [], 'original_endpoints': ['88.135.143.159:443']}, {'number': 12, 'expected_proxy_server_ip': '203.236.17.77', 'proxy_url': 'https://devgmp.sktelecom.com:8104', 'scheme': 'https', 'prior_status_median_seconds': 1.528, 'alternate_urls': [], 'original_endpoints': ['203.236.17.77:8104']}, {'number': 13, 'expected_proxy_server_ip': '31.31.78.117', 'proxy_url': 'https://b.skoleni.xyz:443', 'scheme': 'https', 'prior_status_median_seconds': 1.56, 'alternate_urls': ['https://conference.zona52.eu:443'], 'original_endpoints': ['31.31.78.117:443']}, {'number': 14, 'expected_proxy_server_ip': '82.64.46.151', 'proxy_url': 'https://2ni-explo.duckdns.org:443', 'scheme': 'https', 'prior_status_median_seconds': 1.692, 'alternate_urls': [], 'original_endpoints': ['82.64.46.151:443']}, {'number': 15, 'expected_proxy_server_ip': '212.243.240.120', 'proxy_url': 'https://tosca.kolanda-regina.ch:443', 'scheme': 'https', 'prior_status_median_seconds': 1.712, 'alternate_urls': [], 'original_endpoints': ['212.243.240.120:443']}, {'number': 16, 'expected_proxy_server_ip': '193.226.205.54', 'proxy_url': 'https://turing.ulx.hu:443', 'scheme': 'https', 'prior_status_median_seconds': 1.774, 'alternate_urls': ['https://www.turing.ulx.hu:443'], 'original_endpoints': ['193.226.205.54:443']}, {'number': 17, 'expected_proxy_server_ip': '134.1.7.9', 'proxy_url': 'https://mvre.webodv.cloud.awi.de:443', 'scheme': 'https', 'prior_status_median_seconds': 1.797, 'alternate_urls': [], 'original_endpoints': ['134.1.7.9:443']}, {'number': 18, 'expected_proxy_server_ip': '193.77.81.97', 'proxy_url': 'https://gitlab.klemenc.io:443', 'scheme': 'https', 'prior_status_median_seconds': 1.863, 'alternate_urls': [], 'original_endpoints': ['193.77.81.97:443']}, {'number': 19, 'expected_proxy_server_ip': '178.115.238.253', 'proxy_url': 'https://www.stagebox.at:443', 'scheme': 'https', 'prior_status_median_seconds': 1.97, 'alternate_urls': [], 'original_endpoints': ['178.115.238.253:443']}, {'number': 20, 'expected_proxy_server_ip': '54.37.72.89', 'proxy_url': 'https://b4cextract.board4care.com:443', 'scheme': 'https', 'prior_status_median_seconds': 2.195, 'alternate_urls': [], 'original_endpoints': ['54.37.72.89:443']}, {'number': 21, 'expected_proxy_server_ip': '193.137.38.135', 'proxy_url': 'https://portal.i3s.up.pt:443', 'scheme': 'https', 'prior_status_median_seconds': 2.283, 'alternate_urls': [], 'original_endpoints': ['193.137.38.135:443']}, {'number': 22, 'expected_proxy_server_ip': '195.181.220.235', 'proxy_url': 'https://login.farmcloud.cz:443', 'scheme': 'https', 'prior_status_median_seconds': 2.331, 'alternate_urls': [], 'original_endpoints': ['195.181.220.235:443']}, {'number': 23, 'expected_proxy_server_ip': '168.138.159.191', 'proxy_url': 'https://onlinelab.com.br:443', 'scheme': 'https', 'prior_status_median_seconds': 2.686, 'alternate_urls': ['https://www.onlinelab.com.br:443'], 'original_endpoints': ['168.138.159.191:443']}, {'number': 24, 'expected_proxy_server_ip': '134.0.63.185', 'proxy_url': 'https://eregjistri.fsdksh.gov.al:443', 'scheme': 'https', 'prior_status_median_seconds': 2.947, 'alternate_urls': [], 'original_endpoints': ['134.0.63.185:443']}, {'number': 25, 'expected_proxy_server_ip': '198.54.223.176', 'proxy_url': 'https://alecto.cput.ac.za:443', 'scheme': 'https', 'prior_status_median_seconds': 3.306, 'alternate_urls': [], 'original_endpoints': ['198.54.223.176:443']}, {'number': 26, 'expected_proxy_server_ip': '51.254.205.199', 'proxy_url': 'http://51.254.205.199:11211', 'scheme': 'http', 'prior_status_median_seconds': 1.492, 'alternate_urls': [], 'original_endpoints': ['51.254.205.199:11211']}, {'number': 27, 'expected_proxy_server_ip': '46.30.160.47', 'proxy_url': 'http://46.30.160.47:7070', 'scheme': 'http', 'prior_status_median_seconds': 1.833, 'alternate_urls': [], 'original_endpoints': ['46.30.160.47:7070']}, {'number': 28, 'expected_proxy_server_ip': '45.186.6.104', 'proxy_url': 'http://45.186.6.104:3128', 'scheme': 'http', 'prior_status_median_seconds': 2.039, 'alternate_urls': [], 'original_endpoints': ['45.186.6.104:3128']}]
          SERVICES = [
              ('ipify', 'https://api.ipify.org?format=json', 'json'),
              ('amazon', 'https://checkip.amazonaws.com', 'text'),
              ('icanhazip', 'https://ipv4.icanhazip.com', 'text'),
          ]
          ROOT = Path('exit-ip-out')
          LOCK = threading.Lock()
          
          
          def capture(command, timeout=18):
              try:
                  process = subprocess.run(command, capture_output=True, timeout=timeout)
                  return {'command_array': command, 'exit_code': process.returncode,
                          'literal_stdout': process.stdout.decode('utf-8', errors='replace'),
                          'literal_stderr': process.stderr.decode('utf-8', errors='replace')}
              except subprocess.TimeoutExpired as exc:
                  return {'command_array': command, 'exit_code': None,
                          'supervisor_timeout_seconds': timeout,
                          'literal_stdout': (exc.stdout or b'').decode('utf-8', errors='replace'),
                          'literal_stderr': (exc.stderr or b'').decode('utf-8', errors='replace')}
          
          
          def parse_exit_ip(body, kind):
              try:
                  text = body.decode('utf-8').strip()
                  value = json.loads(text).get('ip') if kind == 'json' else text
                  if not isinstance(value, str):
                      return None
                  address = ipaddress.ip_address(value.strip())
                  return str(address) if address.is_global else None
              except (ValueError, TypeError, AttributeError, UnicodeDecodeError):
                  return None
          
          
          def probe(node, service, round_number):
              number = node['number']
              service_id, target, kind = service
              tag = f'{number:02d}-{service_id}-round{round_number}'
              body_path = ROOT / (tag + '.body')
              command = ['curl', '-q', '--silent', '--show-error', '--ipv4',
                         '--proxy', node['proxy_url'], '--noproxy', '',
                         '--connect-timeout', '5', '--max-time', '12',
                         '--max-filesize', '4096', '--proto', '=https',
                         '--user-agent', 'PublicExitIPVerification/1.0',
                         '--output', str(body_path),
                         '--dump-header', str(ROOT / (tag + '.headers')),
                         '--write-out', '%{json}', target]
              started = dt.datetime.now(dt.timezone.utc).isoformat()
              event = capture(command)
              try:
                  metadata = json.loads(event['literal_stdout'])
              except ValueError:
                  metadata = {}
              body = body_path.read_bytes() if body_path.exists() else b''
              returned_ip = parse_exit_ip(body, kind)
              accepted = event['exit_code'] == 0 and metadata.get('http_code') == 200 and returned_ip is not None
              result = dict(event, number=number, proxy_url=node['proxy_url'],
                            expected_proxy_server_ip=node['expected_proxy_server_ip'],
                            service=service_id, target=target, parser_kind=kind,
                            round=round_number, started_utc=started, metadata=metadata,
                            body_text=body.decode('utf-8', errors='replace'),
                            returned_exit_ip=returned_ip, accepted=accepted,
                            note='returned_exit_ip is the destination reply; metadata.remote_ip is only the proxy server connection.')
              (ROOT / (tag + '.json')).write_text(json.dumps(result, indent=2), encoding='utf-8')
              summary = {key: result[key] for key in ('number', 'proxy_url', 'service', 'round', 'accepted', 'returned_exit_ip', 'exit_code')}
              summary.update(connected_server_ip=metadata.get('remote_ip'), target_http=metadata.get('http_code'),
                             error=event['literal_stderr'].strip()[:180])
              with LOCK:
                  print(json.dumps(summary), flush=True)
              return result
          
          
          def parallel(arguments):
              with futures.ThreadPoolExecutor(max_workers=6) as pool:
                  pending = [pool.submit(probe, *args) for args in arguments]
                  return [future.result() for future in futures.as_completed(pending)]
          
          
          def summarize_node(node, results, direct_ips):
              own = [row for row in results if row['number'] == node['number']]
              valid = [row for row in own if row['accepted']]
              by_ip = collections.defaultdict(list)
              for row in valid:
                  by_ip[row['returned_exit_ip']].append(row)
              confirmed_ips = []
              repeated_confirmed_ips = []
              for address, samples in by_ip.items():
                  if len({row['service'] for row in samples}) >= 2:
                      confirmed_ips.append(address)
                  if all(len({row['service'] for row in samples if row['round'] == round_number}) >= 2
                         for round_number in (1, 2)):
                      repeated_confirmed_ips.append(address)
              stable_ip = repeated_confirmed_ips[0] if len(by_ip) == 1 and len(repeated_confirmed_ips) == 1 else None
              if stable_ip:
                  status = 'ALL_SIX_AGREE' if len(valid) == 6 else 'REPEATED_CROSS_VERIFIED_WITH_FAILURES'
              elif len(by_ip) > 1:
                  status = 'VARIABLE_OR_TARGET_DEPENDENT_EGRESS'
              elif confirmed_ips:
                  status = 'CROSS_VERIFIED_NOT_ENOUGH_REPEATS'
              elif valid:
                  status = 'SINGLE_SERVICE_ONLY'
              else:
                  status = 'NO_VERIFIED_ECHO'
              connected = sorted({row['metadata'].get('remote_ip') for row in own if row['metadata'].get('remote_ip')})
              return dict(node, status=status, attempted_samples=len(own), accepted_samples=len(valid),
                          observed_exit_ips=sorted(by_ip), cross_service_confirmed_ips=sorted(confirmed_ips),
                          repeated_cross_service_confirmed_ips=sorted(repeated_confirmed_ips), stable_exit_ip=stable_ip,
                          observed_proxy_server_ips=connected,
                          server_dns_changed=any(ip != node['expected_proxy_server_ip'] for ip in connected),
                          same_as_direct_control=stable_ip in direct_ips if stable_ip else False,
                          services_by_exit_ip={ip: sorted({row['service'] for row in samples}) for ip, samples in by_ip.items()})
          
          
          def main():
              ROOT.mkdir(exist_ok=True)
              for key in list(os.environ):
                  if key.lower() in ('http_proxy', 'https_proxy', 'all_proxy', 'no_proxy'):
                      os.environ.pop(key)
              identity = {'github_run_id': os.getenv('GITHUB_RUN_ID'), 'github_sha': os.getenv('GITHUB_SHA'),
                          'runner_os': os.getenv('RUNNER_OS'), 'runner_environment': os.getenv('RUNNER_ENVIRONMENT'),
                          'started_utc': dt.datetime.now(dt.timezone.utc).isoformat(),
                          'curl_version_event': capture(['curl', '--version']),
                          'scope': 'No account cookies, logins, production secrets or TLS-verification bypass.'}
              direct = {'number': 0, 'proxy_url': '', 'expected_proxy_server_ip': None, 'scheme': 'direct'}
              print('PHASE=direct_exit_controls', flush=True)
              results = parallel([(direct, service, round_number) for round_number in (1, 2) for service in SERVICES])
              for round_number in (1, 2):
                  print('PHASE=proxied_exit_round_' + str(round_number) + ' nodes=' + str(len(NODES)), flush=True)
                  results += parallel([(node, service, round_number) for node in NODES for service in SERVICES])
              results.sort(key=lambda row: (row['number'], row['round'], row['service']))
              direct_ips = sorted({row['returned_exit_ip'] for row in results if row['number'] == 0 and row['accepted']})
              summaries = [summarize_node(node, results, direct_ips) for node in NODES]
              groups = collections.defaultdict(list)
              for row in summaries:
                  if row['stable_exit_ip']:
                      groups[row['stable_exit_ip']].append(row['number'])
              report = {'identity': identity, 'services': SERVICES, 'node_count': len(NODES),
                        'acceptance': 'curl exit0, targetHTTP200, one syntactically valid global public IP in the echo body; strict TLS.',
                        'stable_definition': 'One observed exit IP, with at least two independent services agreeing in each of two rounds.',
                        'direct_control_exit_ips': direct_ips, 'results': results, 'nodes': summaries,
                        'stable_verified_nodes': sum(bool(row['stable_exit_ip']) for row in summaries),
                        'unique_stable_exit_ip_count': len(groups), 'stable_exit_groups': dict(groups),
                        'shared_stable_exit_groups': {ip: numbers for ip, numbers in groups.items() if len(numbers) > 1},
                        'completed_utc': dt.datetime.now(dt.timezone.utc).isoformat()}
              (ROOT / 'results.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
              lines = ['# Proxy public exit-IP verification on GitHub Actions', '',
                       'Echo services: ipify, Amazon checkip, icanhazip. Two rounds, strict TLS, no account data.', '',
                       'Direct runner exit: ' + ', '.join(direct_ips), '',
                       'Stable verified nodes: ' + str(report['stable_verified_nodes']) + '/' + str(len(NODES)),
                       'Distinct stable exit IPs: ' + str(len(groups)), '',
                       '| Proxy URL | Expected server IP | Destination-observed exit IPs | Accepted | Status |',
                       '|---|---|---|---|---|']
              for row in summaries:
                  lines.append('| ' + row['proxy_url'] + ' | ' + row['expected_proxy_server_ip'] + ' | ' +
                               ', '.join(row['observed_exit_ips']) + ' | ' + str(row['accepted_samples']) + '/6 | ' + row['status'] + ' |')
              lines += ['', 'This is a time-limited observation, not a guarantee of future fixed or exclusive IPs. No sign-in run or production setting change.', '']
              markdown = '\n'.join(lines)
              (ROOT / 'report.md').write_text(markdown, encoding='utf-8')
              print(markdown, flush=True)
              if os.getenv('GITHUB_STEP_SUMMARY'):
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as stream:
                      stream.write(markdown)
          
          
          def self_test():
              assert len(NODES) == 28 and len({row['expected_proxy_server_ip'] for row in NODES}) == 28
              assert parse_exit_ip(b'{"ip":"8.8.8.8"}', 'json') == '8.8.8.8'
              assert parse_exit_ip(b'1.1.1.1\n', 'text') == '1.1.1.1'
              for body in (b'127.0.0.1', b'198.51.100.3', b'8.8.8.8, 1.1.1.1', b'<html>blocked</html>'):
                  assert parse_exit_ip(body, 'text') is None
              assert parse_exit_ip(b'{"ip":null}', 'json') is None
              mock = [{'number': 1, 'round': r, 'service': service, 'accepted': True,
                       'returned_exit_ip': '8.8.8.8', 'metadata': {'remote_ip': '9.9.9.9'}}
                      for r in (1, 2) for service in ('ipify', 'amazon', 'icanhazip')]
              result = summarize_node({'number': 1, 'expected_proxy_server_ip': '9.9.9.9'}, mock, ['1.1.1.1'])
              assert result['stable_exit_ip'] == '8.8.8.8' and result['status'] == 'ALL_SIX_AGREE'
              mock[0]['returned_exit_ip'] = '1.0.0.1'
              assert summarize_node({'number': 1, 'expected_proxy_server_ip': '9.9.9.9'}, mock, [])['stable_exit_ip'] is None
              print('SELF_TEST_PASS: 28 server IPs, body-derived exits, global-IP validation, cross-service repeat agreement; no network calls')
          
          
          if __name__ == '__main__':
              self_test() if '--self-test' in sys.argv else main()
          PY
      - name: Preserve actual exit-IP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxy-exit-ip-verification-${{ github.run_id }}
          path: exit-ip-out/
          if-no-files-found: error
          retention-days: 7
