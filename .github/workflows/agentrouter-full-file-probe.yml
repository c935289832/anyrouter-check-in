E_102', '198.54.223.176:443'), ('FILE_NODE_103', '195.181.220.235:443'), ('FILE_NODE_104', '149.210.158.107:5001'), ('FILE_NODE_105', '18.169.247.230:443'), ('FILE_NODE_106', '3.92.137.124:443'), ('FILE_NODE_107', '176.102.64.4:443'), ('FILE_NODE_108', '35.212.100.37:443'), ('FILE_NODE_109', '52.1.130.127:443'), ('FILE_NODE_110', '130.52.199.50:443'), ('FILE_NODE_111', '31.31.78.117:443'), ('FILE_NODE_112', '196.21.61.67:443'), ('FILE_NODE_113', '196.21.60.44:443'), ('FILE_NODE_114', '134.0.63.185:443'), ('FILE_NODE_115', '146.177.5.114:8090'), ('FILE_NODE_116', '93.115.26.111:443'), ('FILE_NODE_117', '20.103.207.25:443'), ('FILE_NODE_118', '200.133.218.122:443'), ('FILE_NODE_119', '81.171.24.164:443'), ('FILE_NODE_120', '209.63.239.148:443'), ('FILE_NODE_121', '192.126.96.110:443'), ('FILE_NODE_122', '88.197.53.165:443'), ('FILE_NODE_123', '208.169.72.50:443'), ('FILE_NODE_124', '200.23.153.161:443'), ('FILE_NODE_125', '201.54.216.54:443'), ('FILE_NODE_126', '193.136.192.57:443'), ('FILE_NODE_127', '91.227.97.113:443'), ('FILE_NODE_128', '205.178.144.247:8443'), ('FILE_NODE_129', '138.108.28.48:443'), ('FILE_NODE_130', '203.193.169.112:443'), ('FILE_NODE_131', '196.21.109.82:443'), ('FILE_NODE_132', '134.1.7.9:443'), ('FILE_NODE_133', '185.96.121.243:9443'), ('FILE_NODE_134', '152.71.251.13:443'), ('FILE_NODE_135', '109.116.41.154:443'), ('FILE_NODE_136', '93.71.245.84:8090'), ('FILE_NODE_137', '93.42.177.250:443'), ('FILE_NODE_138', '91.243.118.217:443'), ('FILE_NODE_139', '83.206.1.225:8090'), ('FILE_NODE_140', '24.225.10.211:443'), ('FILE_NODE_141', '71.43.26.234:443'), ('FILE_NODE_142', '217.181.201.254:8090'), ('FILE_NODE_143', '173.42.49.102:8090'), ('FILE_NODE_144', '162.244.227.36:443'), ('FILE_NODE_145', '98.101.229.212:8090'), ('FILE_NODE_146', '24.142.229.178:8090'), ('FILE_NODE_147', '80.124.109.22:8090'), ('FILE_NODE_148', '66.64.100.66:443'), ('FILE_NODE_149', '72.28.165.185:8090'), ('FILE_NODE_150', '31.32.19.111:8081'), ('FILE_NODE_151', '194.15.211.132:10000'), ('FILE_NODE_152', '209.148.53.153:8090'), ('FILE_NODE_153', '206.253.147.105:8090'), ('FILE_NODE_154', '50.184.176.222:8090'), ('FILE_NODE_155', '66.153.187.90:8090'), ('FILE_NODE_156', '82.96.128.175:8090'), ('FILE_NODE_157', '184.188.139.2:8090'), ('FILE_NODE_158', '188.212.152.62:443'), ('FILE_NODE_159', '20.42.108.114:443'), ('FILE_NODE_160', '83.172.143.53:4443'), ('FILE_NODE_161', '80.24.34.107:8090'), ('FILE_NODE_162', '129.97.50.72:443')]
          ROOT = Path('proxy-probe-out')
          LOCK = threading.Lock()
          
          
          def capture(command, timeout=16):
              try:
                  p = subprocess.run(command, capture_output=True, timeout=timeout)
                  return {'command_array': command, 'exit_code': p.returncode,
                          'literal_stdout': p.stdout.decode('utf-8', errors='replace'),
                          'literal_stderr': p.stderr.decode('utf-8', errors='replace')}
              except subprocess.TimeoutExpired as exc:
                  return {'command_array': command, 'exit_code': None,
                          'supervisor_timeout_seconds': timeout,
                          'literal_stdout': (exc.stdout or b'').decode('utf-8', errors='replace'),
                          'literal_stderr': (exc.stderr or b'').decode('utf-8', errors='replace')}
          
          
          def accepted(exit_code, metadata, body):
              if exit_code != 0 or metadata.get('http_code') != 200:
                  return False
              try:
                  value = json.loads(body)
              except (ValueError, UnicodeDecodeError):
                  return False
              return isinstance(value, dict) and value.get('success') is True
          
          
          def category(event, metadata, body):
              if accepted(event['exit_code'], metadata, body):
                  return 'PASS_JSON'
              code = metadata.get('http_code', 0)
              if metadata.get('http_connect') == 407 or code == 407:
                  return 'PROXY_AUTH_REQUIRED'
              if event['exit_code'] == 60:
                  return 'TLS_CERTIFICATE_FAILURE'
              if event['exit_code'] == 35:
                  return 'TLS_HANDSHAKE_FAILURE'
              if event['exit_code'] == 28 or event['exit_code'] is None:
                  return 'TIMEOUT'
              if event['exit_code'] in (5, 6):
                  return 'DNS_FAILURE'
              if event['exit_code'] == 7:
                  return 'CONNECT_FAILURE'
              if event['exit_code'] == 56:
                  return 'TUNNEL_OR_RECV_FAILURE'
              if code == 200:
                  return 'HTTP_200_BUT_NOT_SUCCESS_JSON'
              return 'HTTP_' + str(code) if code else 'CURL_EXIT_' + str(event['exit_code'])
          
          
          def probe(number, label, authority, scheme='https', phase='literal', pin=None):
              tag = f'{number:02d}-{phase}-{scheme}-' + hashlib.sha256(authority.encode()).hexdigest()[:8]
              body_path = ROOT / (tag + '.body')
              proxy = scheme + '://' + authority if authority else ''
              command = ['curl', '-q', '--silent', '--show-error', '--proxy', proxy,
                         '--noproxy', '', '--connect-timeout', '4', '--max-time', '10',
                         '--max-filesize', '1048576', '--proto', '=https',
                         '--user-agent', 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36',
                         '--output', str(body_path), '--dump-header', str(ROOT / (tag + '.headers')),
                         '--write-out', '%{json}']
              if pin:
                  command += ['--resolve', pin]
              command.append(TARGET)
              started = dt.datetime.now(dt.timezone.utc).isoformat()
              event = capture(command)
              try:
                  metadata = json.loads(event['literal_stdout'])
              except ValueError:
                  metadata = {}
              body = body_path.read_bytes() if body_path.exists() else b''
              result = dict(event, number=number, label=label, authority=authority,
                            scheme=scheme, phase=phase, proxy_url=proxy, pinned_resolution=pin,
                            started_utc=started, target=TARGET, metadata=metadata,
                            accepted=accepted(event['exit_code'], metadata, body),
                            category=category(event, metadata, body), body_bytes=len(body),
                            body_sha256=hashlib.sha256(body).hexdigest(),
                            body_preview=body[:300].decode('utf-8', errors='replace'))
              (ROOT / (tag + '.json')).write_text(json.dumps(result, indent=2), encoding='utf-8')
              summary = {k: result[k] for k in ('number', 'label', 'phase', 'proxy_url', 'exit_code', 'accepted', 'category')}
              summary.update(target_http=metadata.get('http_code'), connect_http=metadata.get('http_connect'),
                             seconds=metadata.get('time_total'), error=event['literal_stderr'].strip()[:180])
              with LOCK:
                  print(json.dumps(summary), flush=True)
              return result
          
          
          def inspect_certificate(number, label, endpoint):
              # Certificate-only handshake: no HTTP request, cookies or account information.
              host, port = endpoint.rsplit(':', 1)
              try:
                  original_ip = str(ipaddress.ip_address(host))
                  verify_options = ['-verify_ip', original_ip]
                  original_addresses = [original_ip]
              except ValueError:
                  verify_options = ['-verify_hostname', host]
                  resolution = capture(['getent', 'ahostsv4', host], timeout=4)
                  original_addresses = sorted({line.split()[0] for line in resolution['literal_stdout'].splitlines() if line.split()})
              event = capture(['openssl', 's_client', '-connect', endpoint, '-servername', host,
                               '-showcerts'] + verify_options + ['-verify_return_error'], timeout=6)
              record = {'number': number, 'label': label, 'endpoint': endpoint,
                        'certificate_only_event': event, 'dns_candidates': [],
                        'note': 'Public certificate inspection only; application probes never disable TLS verification.'}
              match = re.search(r'-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----',
                                event['literal_stdout'], re.S)
              if match:
                  pem = ROOT / f'{number:02d}-peer-certificate.pem'
                  pem.write_text(match.group(0) + '\n', encoding='ascii')
                  info = capture(['openssl', 'x509', '-in', str(pem), '-noout', '-subject', '-issuer',
                                  '-dates', '-ext', 'subjectAltName', '-fingerprint', '-sha256'], timeout=4)
                  record['certificate_details_event'] = info
                  domains = re.findall(r'DNS:([A-Za-z0-9.*-]+)', info['literal_stdout'])
                  for domain in dict.fromkeys(domains):
                      if '*' in domain or len(record['dns_candidates']) >= 2:
                          continue
                      resolved = capture(['getent', 'ahostsv4', domain], timeout=4)
                      addresses = sorted({line.split()[0] for line in resolved['literal_stdout'].splitlines() if line.split()})
                      record['dns_candidates'].append({'hostname': domain, 'addresses': addresses,
                                                       'matches_original_ip': bool(set(addresses) & set(original_addresses)),
                                                       'matching_original_addresses': sorted(set(addresses) & set(original_addresses)),
                                                       'resolution_event': resolved})
              (ROOT / f'{number:02d}-certificate.json').write_text(json.dumps(record, indent=2), encoding='utf-8')
              return record
          
          
          def map_parallel(function, arguments):
              with futures.ThreadPoolExecutor(max_workers=8) as pool:
                  pending = [pool.submit(function, *args) for args in arguments]
                  return [future.result() for future in futures.as_completed(pending)]
          
          
          def main():
              ROOT.mkdir(exist_ok=True)
              for key in list(os.environ):
                  if key.lower() in ('http_proxy', 'https_proxy', 'all_proxy', 'no_proxy'):
                      os.environ.pop(key)
              identity = {'github_run_id': os.getenv('GITHUB_RUN_ID'), 'github_sha': os.getenv('GITHUB_SHA'),
                          'runner_os': os.getenv('RUNNER_OS'), 'runner_environment': os.getenv('RUNNER_ENVIRONMENT'),
                          'target': TARGET, 'started_utc': dt.datetime.now(dt.timezone.utc).isoformat(),
                          'curl_version': capture(['curl', '--version']),
                          'scope': 'No login, account cookies, secrets or TLS verification bypass. The old hostname control is public from the conversation, not read from any Secret.'}
              (ROOT / 'identity.json').write_text(json.dumps(identity, indent=2), encoding='utf-8')
              print('RUNNER_IDENTITY=' + json.dumps(identity), flush=True)
              results = [probe(0, 'DIRECT_CONTROL', '', 'direct', 'control'),
                         probe(99, 'PREVIOUS_PUBLIC_HOSTNAME_CONTROL', 'dev.cloudpbx.us:443', 'https', 'control')]
              jobs = [(i, label, endpoint, scheme) for i, (label, endpoint) in enumerate(ENDPOINTS, 1)
                      for scheme in ('https', 'http')]
              print('PHASE=full_literal_screen attempts=' + str(len(jobs)), flush=True)
              results += map_parallel(probe, jobs)
              cert_jobs = [(r['number'], r['label'], r['authority']) for r in results
                           if r['phase'] == 'literal' and r['scheme'] == 'https' and r['exit_code'] == 60
                           and r['metadata'].get('http_connect', 0) == 0]
              print('PHASE=certificate_inspection candidates=' + str(len(cert_jobs)), flush=True)
              certificates = map_parallel(inspect_certificate, cert_jobs)
              hostname_jobs = []
              for cert in certificates:
                  original_host, port = cert['endpoint'].rsplit(':', 1)
                  for item in cert['dns_candidates']:
                      if item['matches_original_ip']:
                          hostname = item['hostname']
                          hostname_jobs.append((cert['number'], cert['label'], hostname + ':' + port,
                                                'https', 'certificate_hostname', hostname + ':' + port + ':' + item['matching_original_addresses'][0]))
              print('PHASE=certificate_hostname_retests attempts=' + str(len(hostname_jobs)), flush=True)
              results += map_parallel(probe, hostname_jobs)
              # A second public-status request checks whether an initial success immediately repeats.
              repeats = [(r['number'], r['label'], r['authority'], r['scheme'],
                          'confirm_' + r['phase'], r['pinned_resolution'])
                         for r in results if r['accepted'] and r['phase'] != 'control']
              results += map_parallel(probe, repeats)
              # Verify every initially working route using ordinary DNS, without IP pinning.
              normal_routes = {}
              for row in results:
                  if row['accepted'] and row['phase'] != 'control':
                      normal_routes.setdefault((row['number'], row['scheme'], row['authority']), row['label'])
              for round_number in (1, 2):
                  print('PHASE=normal_dns_round_' + str(round_number) + ' routes=' + str(len(normal_routes)), flush=True)
                  normal_jobs = [(number, label, authority, scheme, 'normal_dns_round_' + str(round_number), None)
                                 for (number, scheme, authority), label in normal_routes.items()]
                  results += map_parallel(probe, normal_jobs)
              results.sort(key=lambda r: (r['number'], r['phase'], r['scheme'], r['authority']))
              report = {'identity': identity, 'input_endpoint_count': len(ENDPOINTS),
                        'acceptance': 'curl exit 0, strict proxy/target TLS, target HTTP 200, JSON object success=true',
                        'scope_limit': 'Public status only, not authenticated account/check-in success; one GitHub runner at one time.',
                        'results': results, 'certificates': certificates,
                        'completed_utc': dt.datetime.now(dt.timezone.utc).isoformat()}
              (ROOT / 'results.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
              rows = ['# AgentRouter status proxy screen on GitHub Actions', '',
                      'Target: `' + TARGET + '`', '', report['scope_limit'], '',
                      '| Endpoint | HTTPS literal | HTTP CONNECT | Certificate hostname retest |',
                      '|---|---|---|---|']
              for i, (label, endpoint) in enumerate(ENDPOINTS, 1):
                  own = [r for r in results if r['number'] == i]
                  literal = {r['scheme']: r['category'] for r in own if r['phase'] == 'literal'}
                  named = ', '.join(r['proxy_url'] + ': ' + r['category'] for r in own if r['phase'] == 'certificate_hostname') or '-'
                  rows.append('| ' + endpoint + ' | ' + literal['https'] + ' | ' + literal['http'] + ' | ' + named + ' |')
              rows += ['', '## All successful observations', '']
              good = [r for r in results if r['accepted']]
              rows += ['- ' + r['proxy_url'] + ' (' + r['phase'] + ')' for r in good]
              if not good:
                  rows.append('- No accepted response observed, including controls.')
              rows += ['', 'All request probes retain TLS verification. Certificate hostnames are retried only if DNS resolves to the original supplied IP. No production proxy was changed.', '']
              markdown = '\n'.join(rows)
              (ROOT / 'report.md').write_text(markdown, encoding='utf-8')
              with LOCK:
                  print(markdown, flush=True)
              summary = os.getenv('GITHUB_STEP_SUMMARY')
              if summary:
                  with open(summary, 'a', encoding='utf-8') as stream:
                      stream.write(markdown)
          
          
          def self_test():
              assert len(ENDPOINTS) == 162 and len({e for _, e in ENDPOINTS}) == 162
              for _, endpoint in ENDPOINTS:
                  host, port = endpoint.rsplit(':', 1)
                  assert 0 < int(port) < 65536
                  try:
                      assert ipaddress.ip_address(host).is_global
                  except ValueError:
                      assert re.fullmatch(r'[a-z0-9](?:[a-z0-9.-]*[a-z0-9])?', host), host
              assert accepted(0, {'http_code': 200}, b'{"success":true}')
              assert not accepted(0, {'http_code': 200}, b'<html>challenge</html>')
              assert not accepted(60, {'http_code': 200}, b'{"success":true}')
              assert not accepted(0, {'http_code': 403}, b'{"success":true}')
              assert not accepted(0, {'http_code': 200}, b'{"success":false}')
              print('SELF_TEST_PASS: 162 endpoints; strict status-JSON acceptance; no network calls')
          
          
          if __name__ == '__main__':
              self_test() if '--self-test' in sys.argv else main()
          PY
      - name: Preserve full anonymous diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentrouter-full-file-screen-${{ github.run_id }}
          path: proxy-probe-out/
          if-no-files-found: error
          retention-days: 7
